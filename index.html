<body>
  <canvas id="background-canvas"></canvas>
  <app-root></app-root>
  <script>
    const canvas = document.getElementById('background-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    let stars = [];
    let mouseX = 0, mouseY = 0;
    let lastTime = 0;
    const isMobile = window.innerWidth < 768;
    const targetFPS = isMobile ? 30 : 60;
    const frameInterval = 1000 / targetFPS;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initParticles();
      initStars();
    }

    function initParticles() {
      particles = [];
      const isMobile = window.innerWidth < 768;
      const particleCount = isMobile ? 60 : 150;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          z: Math.random() * 1500,
          size: Math.random() * 3 + 1,
          speedZ: Math.random() * 3 + 1.5,
          speedX: (Math.random() - 0.5) * 0.4,
          speedY: (Math.random() - 0.5) * 0.4,
          hue: Math.random() * 60 + 240,
          layer: Math.floor(Math.random() * 3)
        });
      }
    }

    function initStars() {
      stars = [];
      const isMobile = window.innerWidth < 768;
      const starCount = isMobile ? 80 : 200;

      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.5 + 0.5,
          twinkle: Math.random() * Math.PI * 2,
          twinkleSpeed: Math.random() * 0.05 + 0.02
        });
      }
    }

    function drawBackground() {
      // Darker gradient for better contrast
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, '#0e0e18');
      gradient.addColorStop(0.25, '#0d0d16');
      gradient.addColorStop(0.5, '#0c0c14');
      gradient.addColorStop(0.75, '#0d0d16');
      gradient.addColorStop(1, '#0e0e18');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      // Subtle radial glow
      const radialGlow = ctx.createRadialGradient(
        width / 2, height / 2, 0,
        width / 2, height / 2, Math.max(width, height) * 0.6
      );
      radialGlow.addColorStop(0, 'rgba(99, 102, 241, 0.08)');
      radialGlow.addColorStop(0.5, 'rgba(139, 92, 246, 0.04)');
      radialGlow.addColorStop(1, 'rgba(12, 12, 20, 0)');
      ctx.fillStyle = radialGlow;
      ctx.fillRect(0, 0, width, height);
    }

    function drawStars() {
      stars.forEach(star => {
        star.twinkle += star.twinkleSpeed;
        const brightness = 0.3 + Math.sin(star.twinkle) * 0.3;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
        ctx.fill();
      });
    }

    function drawParticles() {
      // Sort by Z for proper depth
      particles.sort((a, b) => b.z - a.z);

      particles.forEach(p => {
        p.z -= p.speedZ;
        if (p.z <= 0) {
          p.z = 1500;
          p.x = Math.random() * width;
          p.y = Math.random() * height;
        }

        const mouseInfluence = 0.00015;
        p.x += p.speedX + (mouseX - width / 2) * mouseInfluence;
        p.y += p.speedY + (mouseY - height / 2) * mouseInfluence;

        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        const scale = 1500 / p.z;
        const x2d = (p.x - width / 2) * scale + width / 2;
        const y2d = (p.y - height / 2) * scale + height / 2;
        const size2d = p.size * scale;

        if (x2d < 0 || x2d > width || y2d < 0 || y2d > height) return;

        const depth = 1 - p.z / 1500;
        const alpha = depth * 0.7;
        const hue = p.hue + Math.sin(Date.now() * 0.0008) * 20;

        // Main particle
        ctx.beginPath();
        ctx.arc(x2d, y2d, size2d, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue}, 80%, 65%, ${alpha})`;
        ctx.fill();

        // Outer glow
        const gradient = ctx.createRadialGradient(x2d, y2d, 0, x2d, y2d, size2d * 4);
        gradient.addColorStop(0, `hsla(${hue}, 80%, 65%, ${alpha * 0.5})`);
        gradient.addColorStop(1, `hsla(${hue}, 80%, 65%, 0)`);
        ctx.beginPath();
        ctx.arc(x2d, y2d, size2d * 4, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        // Strong glow for very close particles
        if (p.z < 400) {
          ctx.shadowColor = `hsla(${hue}, 80%, 65%, 0.9)`;
          ctx.shadowBlur = 30;
          ctx.beginPath();
          ctx.arc(x2d, y2d, size2d * 1.5, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${hue}, 90%, 75%, ${alpha})`;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      });
    }

    function drawConnections() {
      ctx.strokeStyle = 'rgba(99, 102, 241, 0.15)';
      ctx.lineWidth = 1;

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const p1 = particles[i];
          const p2 = particles[j];

          if (p1.z > 800 || p2.z > 800) continue;

          const scale1 = 1500 / p1.z;
          const scale2 = 1500 / p2.z;
          const x1 = (p1.x - width / 2) * scale1 + width / 2;
          const y1 = (p1.y - height / 2) * scale1 + height / 2;
          const x2 = (p2.x - width / 2) * scale2 + width / 2;
          const y2 = (p2.y - height / 2) * scale2 + height / 2;

          const dist = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);

          if (dist < 150) {
            const alpha = (1 - dist / 150) * 0.3;
            ctx.strokeStyle = `rgba(99, 102, 241, ${alpha})`;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }
        }
      }
    }

    function animate(currentTime) {
      requestAnimationFrame(animate);

      const elapsed = currentTime - lastTime;
      if (elapsed < frameInterval) return;

      lastTime = currentTime - (elapsed % frameInterval);

      drawBackground();
      drawStars();
      drawConnections();
      drawParticles();
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });
    resize();
    animate(0);
  </script>
