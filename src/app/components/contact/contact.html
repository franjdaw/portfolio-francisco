<section class="section" id="contact">
  <div class="container">
    <h2 class="section-title">Contacto</h2>
    <p class="contact-intro">
      ¿Buscas un desarrollador para tu equipo? Contacta conmigo directamente.
    </p>
    <div class="contact-buttons">
      <a href="mailto:{{ email }}" class="contact-btn primary">
        <span class="btn-icon">✉️</span>
        <div class="btn-content">
          <span class="btn-title">Email</span>
          <span class="btn-subtitle">{{ email }}</span>
        </div>
      </a>
      <a href="tel:{{ phone }}" class="contact-btn secondary">
        <span class="btn-icon">📞</span>
        <div class="btn-content">
          <span class="btn-title">Teléfono</span>
          <span class="btn-subtitle">{{ phone }}</span>
        </div>
      </a>
      <a href="https://{{ linkedin }}" target="_blank" rel="noopener" class="contact-btn tertiary">
        <span class="btn-icon">💼</span>
        <div class="btn-content">
          <span class="btn-title">LinkedIn</span>
          <span class="btn-subtitle">Conectar</span>
        </div>
      </a>
    </div>
  </div>
</section>
